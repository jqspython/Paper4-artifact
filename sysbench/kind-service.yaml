apiVersion: v1
kind: Namespace
metadata:
  name: paper4-v3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-http
  namespace: paper4-v3
spec:
  replicas: 1
  selector:
    matchLabels: {app: paper4-cpu-http}
  template:
    metadata:
      labels: {app: paper4-cpu-http}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: cpu-http
        image: paper4-v3-http:feasibility
        imagePullPolicy: Never
        env:
        - {name: STARTUP_SLEEP, value: '5'}
        ports:
        - {containerPort: 8080}
        resources:
          requests: {cpu: 250m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 1
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-http
  namespace: paper4-v3
spec:
  type: NodePort
  selector: {app: paper4-cpu-http}
  ports:
  - {port: 8080, targetPort: 8080, nodePort: 30080}
